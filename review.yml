aid: santander-us
name: Santander US
review:
  question: Does Santander Bank, N.A. (US) expose a documented public first-party developer API?
  answer: false
  date: '2026-07-23'
  reviewer: API Evangelist
findings:
  summary: |
    Santander Bank, N.A. — the US retail and commercial banking subsidiary of
    Banco Santander S.A. (santanderbank.com) — publishes NO public, first-party
    developer API for its US franchise. There is no live US developer portal:
    developer.santanderbank.com does not resolve (curl 000), santanderbank.com/developers
    and santanderbank.com/api both return 404, and the site sitemap (sitemap-en.xml)
    contains zero developer, /api, or open-banking pages. A host at
    api.santanderbank.com responds 403 but is not a documented, browsable developer
    portal and exposes no public API reference or specification.

    US open finance is voluntary and fragmented — there is no single mandated
    open-banking contract as in the UK (OBIE) or Australia (CDR). Santander US's
    consumer-permissioned data is reached through AGGREGATORS rather than a direct
    first-party API. Plaid documents connectivity to "Santander - Personal" for the
    products Assets, Auth, Balance, and Transactions. No first-party FDX (Financial
    Data Exchange) participation and no published CFPB Section 1033 (Personal
    Financial Data Rights) posture were found for the US retail entity specifically;
    broader US data sharing is moving industry-wide through aggregator networks
    (Plaid; FDX-standard networks such as Akoya).

    Distinct-entity caution: Santander's UK developer portal
    (developer.santander.co.uk) and the group's Corporate & Investment Banking API
    marketplace (apimarket.santandercib.com) are operated by SEPARATE Banco Santander
    legal entities and are not the US retail bank's surface; they were deliberately
    NOT attributed to Santander US. No downloadable OpenAPI/Swagger was harvested
    because none is published for the US entity.
